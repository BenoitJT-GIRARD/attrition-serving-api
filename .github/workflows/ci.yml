name: CI

# No `schedule` trigger: this workflow runs on code changes, and at no other time.
on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attrition
          POSTGRES_PASSWORD: attrition_pwd
          POSTGRES_DB: attrition_serving
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attrition -d attrition_serving"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # No dotenv on a runner: the workflow decides the configuration, not a file that
      # happens to be in the checkout.
      SKIP_DOTENV: "1"
      API_KEY: "test_key"
      MODEL_VERSION: "ci"
      DATABASE_URL: "postgresql+psycopg://attrition:attrition_pwd@localhost:5432/attrition_serving"
      # MODEL_THRESHOLD is deliberately unset. It used to be pinned to 0.5 here, which is
      # the value the audit found the service falling back to, and setting it in CI would
      # mean the tests never exercise the path that reads the model card.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev --group serve --group db

      # Checks only: `ruff` never rewrites the tree here. Formatting is a local hook.
      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit
        run: uv run bandit -c pyproject.toml -q -r src scripts

      - name: Apply the database schema
        run: uv run python scripts/db_apply_schema.py

      - name: Seed the ten-row sample
        run: uv run python scripts/db_seed_employees.py

      # Warnings are errors, and coverage is measured in the same pass rather than by
      # running the suite twice.
      - name: Pytest
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: reports/coverage.xml
