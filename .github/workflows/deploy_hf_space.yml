name: Deploy

# Only from `main`, and only after CI is green on the same commit. The deploy job used to
# repeat the whole test job inline, so a change to one could silently diverge from the other.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # The username in the URL is ignored when a token is supplied; it used to be a
          # personal handle hard-coded in a public workflow.
          git push "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
