[project]
name = "attrition-serving"
version = "1.0.2"
description = "Attrition model served behind an API that records every decision it makes."
readme = "README.md"
authors = [
    { name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attrition_serving"]

[dependency-groups]
db = [
    "psycopg[binary]>=3.3.2",
    "sqlalchemy>=2.0.45",
]
dev = [
    "bandit>=1.9.2",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    # Pinned: 0.14 and 0.16 disagree on thirty-seven findings, and a lint that passes on
    # one machine and fails on the next is worse than no lint at all.
    "ruff>=0.16.6",
    "httpx>=0.28.1",
    # scripts/capture.py drives Swagger through a real browser: the response panel only
    # exists after the request has run, and Chrome's virtual clock does not wait for it.
    "playwright>=1.47.0",
]
mlops = [
    "mlflow>=3.7.0",
    "shap>=0.49.1",
]
notebook = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.1",
]
serve = [
    "fastapi>=0.124.4",
    "pydantic>=2.12.4",
    "uvicorn[standard]>=0.38.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` and `Query()` in a default argument is how FastAPI declares a dependency; the
# object is inspected at import, never mutated per request. B008 exists for mutable
# defaults, which these are not.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]


[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
#  is on the path so the unit tier can import a script and test the function it
# holds, instead of shelling out to it and asserting on printed text.
pythonpath = ["src", "scripts"]
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage/coverage.xml"
markers = [
    "integration: two real components of the repository wired together, or one against a real external dependency",
    "system: the product started the way the README says to start it, questioned through its public surface",
    "claim: fails when a published number, figure, table or artefact stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors. The suite had no filter at all, so nothing a dependency
# deprecated would ever have failed a run.
filterwarnings = ["error"]

[tool.coverage.run]
# Without this, the published XML report writes the absolute root of the measured sources:
# a reader finds the directory tree of the machine that ran the suite, and two runs on two
# machines produce two different files for the same numbers.
relative_files = true
source = ["src/attrition_serving", "scripts"]
branch = true
data_file = "var/.coverage"
# The figure style is copied in rather than imported, so a clone needs nothing beyond
# matplotlib, and it is tested at its source. Measuring it here would report someone
# else's coverage as this project's.
omit = [
    # Copied in rather than imported, so a clone needs nothing extra to install, and tested
    # at their source. Measuring them here would report someone else's coverage as this
    # project's.
    "*/figure_style.py",
    "scripts/capture.py",
    "scripts/smoke.py",
    "scripts/run_notebooks.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
# The floor is the rate measured the day the suite was completed, rounded down. A floor
# below the current rate is not a floor: it lets the next commit lose coverage in silence.
fail_under = 54

# The CI calls `bandit -c pyproject.toml`, which without this section silently falls back to
# defaults -- including flagging every `assert` in the test suite the day someone points it
# at tests/.
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
skips = ["B101"]  # assert_used -- pytest convention
